services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: metro-route-finder:latest
    container_name: metro-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CROWD_ALPHA: ${CROWD_ALPHA:-0.3}
      PEAK_HOURS: ${PEAK_HOURS:-08:00-10:00,17:30-20:00}
      TRANSFER_PENALTY: ${TRANSFER_PENALTY:-300}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: Nginx reverse proxy + static frontend serving
